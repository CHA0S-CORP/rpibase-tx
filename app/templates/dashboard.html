{% extends "base.html" %}
{% block content %}
<div class="grid">
  <section class="tx-col">
    <div class="tx-head">
      <h1>Transmit</h1>
      <span id="watchdog-hint" class="hint">{% include "_watchdog_hint.html" %}</span>
    </div>

    <nav class="mode-tabs" id="mode-tabs" aria-label="Mode">
      {% for name, m in modes.items() %}
      <button type="button"
              class="tab{% if loop.first %} active{% endif %}"
              data-mode="{{ name }}"
              title="{{ m.desc }}"
              hx-get="/partials/form?mode={{ name }}"
              hx-target="#mode-form">{{ name }}</button>
      {% endfor %}
    </nav>

    <div id="mode-form" class="panel"
         hx-get="/partials/form?mode={{ modes.keys() | first }}"
         hx-trigger="load">
    </div>
  </section>

  <aside class="status-col">
    <div id="flash"></div>
    <div id="status"
         hx-get="/partials/status"
         hx-trigger="load, every 1s">
      <div class="panel"><p class="hint">loading…</p></div>
    </div>

    {% include "_limits.html" %}

    <div id="uploads"
         hx-get="/partials/uploads"
         hx-trigger="load">
      <div class="panel"><div class="panel-title">Uploads</div></div>
    </div>
  </aside>
</div>

<script>
  // Mode tab active state (the form itself is swapped in by HTMX).
  document.getElementById('mode-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    this.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === b); });
  });
  // Live "= X MHz" helper next to freq_hz.
  document.body.addEventListener('input', function (e) {
    if (e.target.name !== 'freq_hz') return;
    var out = e.target.closest('.field').querySelector('.mhz'); if (!out) return;
    var hz = parseInt(e.target.value, 10);
    out.textContent = isFinite(hz) ? '= ' + (hz / 1e6).toFixed(3) + ' MHz' : '';
  });
</script>
{% endblock %}
