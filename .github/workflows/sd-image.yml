name: Build SD image

# Builds the Raspberry Pi 3 NixOS SD image (`.#sdImage`). The image targets
# aarch64-linux and we run on a NATIVE arm64 runner, so everything builds
# without emulation. This matters here because the nixos-hardware Pi kernel is
# not in any binary cache and must compile from source; under QEMU that alone
# would blow the timeout. Most of the rest of the closure comes prebuilt from
# cache.nixos.org; the image is then assembled and zstd-compressed.
#
# Runs on manual dispatch (artifact only) and on version tags (also publishes a
# GitHub Release with the image attached).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: sd-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner: builds the aarch64 image without emulation. Free on
    # public repos. The Pi kernel compiles here in-arch instead of under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write # create releases / upload assets on tags
    steps:
      - uses: actions/checkout@v4

      # NixOS image assembly needs far more than the default free space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # Native aarch64 build — no extra-platforms/QEMU needed. Pull as much
          # prebuilt as possible: cache.nixos.org (default) + nix-community.
          # cores=0 uses all runner CPUs per build; max-jobs=1 keeps peak memory
          # bounded during the kernel link.
          extra-conf: |
            max-jobs = 1
            cores = 0
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            builders-use-substitutes = true

      # Persist the whole /nix/store across runs. Keyed on flake.lock (+ this
      # workflow), so an unchanged closure restores fully and the expensive
      # emulated builds/downloads are skipped. GC keeps the cache under GitHub's
      # per-repo limit; a partial-match prefix still gives a warm start.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '.github/workflows/sd-image.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build SD image
        run: nix build '.#packages.aarch64-linux.sdImage' -L

      - name: Collect image
        id: img
        run: |
          mkdir -p artifacts
          img=$(ls result/sd-image/*.img.zst | head -1)
          cp -L "$img" artifacts/
          echo "name=$(basename "$img")" >> "$GITHUB_OUTPUT"
          ls -lh artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpitx-pi3-sd-image
          path: artifacts/*.img.zst
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.img.zst
          generate_release_notes: true
